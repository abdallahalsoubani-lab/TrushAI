version: '3.8'

# Smart Waste Monitoring - Docker Compose
# ========================================
# Simple orchestration for local development

services:
  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-waste-backend
    ports:
      - "8000:8000"
    volumes:
      # Mount data directory for video input/output
      - ./data:/app/data
      # Mount code for development (optional)
      # - ./ai:/app/ai
      # - ./backend:/app/backend
    environment:
      - LOG_LEVEL=INFO
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - YOLO_DEVICE=cpu
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Dashboard (Next.js)
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dev
    container_name: smart-waste-dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

# Networks
networks:
  default:
    name: smart-waste-network

# Volumes
volumes:
  data:
    driver: local

# ========================================
# Usage:
# ========================================
#
# Start all services:
#   docker-compose up -d
#
# View logs:
#   docker-compose logs -f
#
# Stop all services:
#   docker-compose down
#
# Rebuild:
#   docker-compose up -d --build
#
